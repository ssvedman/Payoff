name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The weekly keepalive commits a heartbeat purely to keep GitHub from disabling
    # its own schedule. Rebuilding the site for it would be pointless churn.
    paths-ignore:
      - '.github/last-keepalive'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build
        env:
          # Public by design. The publishable key grants nothing without a session
          # JWT, and RLS is the security boundary.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      # Pages must already exist with build_type=workflow. The `enablement: true`
      # option looks like it would create it, but GITHUB_TOKEN is refused with
      # "Resource not accessible by integration" — creating a Pages site needs a
      # user token or the Settings UI. It was enabled once via:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - id: deployment
        uses: actions/deploy-pages@v5
